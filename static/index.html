// ---- Screen mirror: raw H.264 over HTTP, decoded with WebCodecs; input via adb; record from a composite canvas ----
const mirror = { open: false, serial: null, abort: null, decoder: null, retry: null, info: null, subBase: '—' };
const mEl = {
  toggle: document.getElementById('mirror-toggle'), canvas: document.getElementById('mirror-canvas'),
  fx: document.getElementById('mirror-fx'), screen: document.getElementById('mirror-screen'),
  stage: document.getElementById('mirror-stage'), msg: document.getElementById('mirror-msg'),
  sub: document.getElementById('mirror-sub'), toast: document.getElementById('mirror-toast'),
  recBtn: document.getElementById('mirror-rec'), recTimer: document.getElementById('mirror-rec-timer'),
  shotBtn: document.getElementById('mirror-shot'),
};
const mCtx = mEl.canvas.getContext('2d');
const fxCtx = mEl.fx.getContext('2d');
let mirrorRatio = 9 / 16;
// frame timestamps (ms) of the last few thousand decoded frames, for measuring smoothness from the console
const mirrorStats = window.__mirrorStats = { times: [], maxQueue: 0, fps: 0, count: 0 };

function mirrorPost(path, body) {
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'tracking-ui' }, body: JSON.stringify(body || {}) })
    .then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`); return j; });
}

let toastTimer = null;
function mirrorToast(text, isErr) {
  mEl.toast.textContent = text;
  mEl.toast.className = isErr ? 'err' : '';
  mEl.toast.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { mEl.toast.style.display = 'none'; }, isErr ? 8000 : 10000);
}

function mirrorMsg(text, isErr) {
  mEl.msg.textContent = text || '';
  mEl.msg.className = isErr ? 'err' : '';
  mEl.msg.style.display = text ? 'flex' : 'none';
  if (text) mEl.screen.style.display = 'none';
}

function mirrorFit() {
  const w = mEl.stage.clientWidth, h = mEl.stage.clientHeight;
  const cw = Math.min(w, h * mirrorRatio);
  mEl.screen.style.width = cw + 'px';
  mEl.screen.style.height = (cw / mirrorRatio) + 'px';
}
new ResizeObserver(mirrorFit).observe(mEl.stage);

setInterval(() => {  // fps readout
  const now = performance.now(), t = mirrorStats.times;
  mirrorStats.fps = t.filter((x) => now - x < 1000).length;
  if (mirror.open && mEl.screen.style.display === 'block') mEl.sub.textContent = `${mirror.subBase} · ${mirrorStats.fps} fps`;
}, 1000);

function mirrorStop() {
  clearTimeout(mirror.retry);
  if (mirror.abort) mirror.abort.abort();
  mirror.abort = null;
  if (mirror.decoder && mirror.decoder.state !== 'closed') { try { mirror.decoder.close(); } catch (e) {} }
  mirror.decoder = null;
}

function concatBytes(parts) {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let off = 0;
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

function mirrorRetryLater(text) {
  mirrorMsg(`${text} — tự thử lại sau 2s`, true);
  mirror.retry = setTimeout(() => { if (mirror.open) mirrorStart(); }, 2000);
}

async function mirrorStart() {
  mirrorStop();
  if (!('VideoDecoder' in window)) { mirrorMsg('Trình duyệt không hỗ trợ WebCodecs — dùng Chrome / Edge / Safari bản mới.', true); return; }
  const ctl = new AbortController();
  mirror.abort = ctl;
  mirrorMsg('Đang kết nối màn hình máy...');
  try {
    const infoRes = await fetch('/api/mirror/info', { signal: ctl.signal });
    const info = await infoRes.json();
    if (!infoRes.ok) throw new Error(info.error || `HTTP ${infoRes.status}`);
    mirror.info = info;
    mirrorRatio = info.width / info.height;
    mirror.subBase = `${info.serial} · ${info.width}×${info.height}`;
    mEl.sub.textContent = mirror.subBase;
    mirrorFit();
    const res = await fetch('/api/mirror.h264', { signal: ctl.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    await mirrorPump(res.body.getReader(), ctl);
    throw new Error('luồng video đã dừng');
  } catch (e) {
    if (!ctl.signal.aborted) mirrorRetryLater(e.message);
  }
}

// Splits the Annex-B byte stream into NAL units and feeds one access unit (SPS/PPS + slice) per chunk.
async function mirrorPump(reader, ctl) {
  let buf = new Uint8Array(0), pending = [], codec = null, ts = 0, gotFrame = false;
  const decoder = new VideoDecoder({
    output(frame) {
      if (mEl.canvas.width !== frame.displayWidth || mEl.canvas.height !== frame.displayHeight) {
        mEl.canvas.width = mEl.fx.width = frame.displayWidth;
        mEl.canvas.height = mEl.fx.height = frame.displayHeight;
      }
      mCtx.drawImage(frame, 0, 0);
      frame.close();
      const t = mirrorStats.times;
      t.push(performance.now()); mirrorStats.count++;
      if (t.length > 6000) t.splice(0, 3000);
      if (!gotFrame) { gotFrame = true; mirrorMsg(''); mEl.screen.style.display = 'block'; mirrorFit(); }
    },
    error(e) { if (!ctl.signal.aborted) { mirrorStop(); mirrorRetryLater(`Lỗi giải mã: ${e.message}`); } },
  });
  mirror.decoder = decoder;
  const hex = (b) => b.toString(16).padStart(2, '0');

  while (true) {
    const { value, done } = await reader.read();
    if (done) return;
    buf = buf.length ? concatBytes([buf, value]) : value;
    const starts = [];  // offsets of every 00 00 01
    for (let i = 0; i + 2 < buf.length; i++) {
      if (buf[i] === 0 && buf[i + 1] === 0 && buf[i + 2] === 1) { starts.push(i); i += 2; }
    }
    // the last NAL may still be arriving: only consume the ones followed by another start code
    for (let k = 0; k + 1 < starts.length; k++) {
      const nal = buf.subarray(starts[k], starts[k + 1]);
      const type = nal[3] & 0x1f;
      if (type !== 1 && type !== 5) {
        if (type === 7) codec = 'avc1.' + hex(nal[4]) + hex(nal[5]) + hex(nal[6]);
        pending.push(nal);
        continue;
      }
      const isKey = type === 5;
      const chunk = concatBytes([...pending, nal]);
      pending = [];
      if (decoder.state === 'closed') return;
      if (decoder.state === 'unconfigured') {
        if (!isKey || !codec) continue;  // can't start mid-GOP
        decoder.configure({ codec, optimizeForLatency: true });
      }
      mirrorStats.maxQueue = Math.max(mirrorStats.maxQueue, decoder.decodeQueueSize);
      decoder.decode(new EncodedVideoChunk({ type: isKey ? 'key' : 'delta', timestamp: (ts += 33333), data: chunk }));
    }
    if (starts.length) buf = buf.slice(starts[starts.length - 1]);
  }
}

// ---- touch input: click = tap, hold = long press, drag = swipe; effects are drawn on #mirror-fx ----
const ripples = [];
let drag = null, fxHad = false;

function fracOf(e) {
  const r = mEl.fx.getBoundingClientRect();
  return { fx: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), fy: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) };
}

function sendInput(cmd) {
  mirrorPost('/api/mirror/input', cmd).catch((err) => mirrorToast(`Gửi thao tác lỗi: ${err.message}`, true));
}

mEl.fx.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || !mirror.info) return;
  mEl.fx.setPointerCapture(e.pointerId);
  const p = fracOf(e);
  drag = { a: p, b: p, t0: performance.now() };
});
mEl.fx.addEventListener('pointermove', (e) => { if (drag) drag.b = fracOf(e); });
mEl.fx.addEventListener('pointercancel', () => { drag = null; });
mEl.fx.addEventListener('pointerup', (e) => {
  if (!drag || !mirror.info) { drag = null; return; }
  const { a, b, t0 } = drag, ms = performance.now() - t0, W = mirror.info.width, H = mirror.info.height;
  drag = null;
  const px = (p) => ({ x: Math.round(p.fx * (W - 1)), y: Math.round(p.fy * (H - 1)) });
  const A = px(a), B = px(fracOf(e));
  ripples.push({ fx: fracOf(e).fx, fy: fracOf(e).fy, t: performance.now() });
  if (Math.hypot(B.x - A.x, B.y - A.y) < 20) {
    if (ms >= 450) sendInput({ type: 'swipe', x1: A.x, y1: A.y, x2: A.x, y2: A.y, ms: Math.max(600, Math.round(ms)) });  // long press
    else sendInput({ type: 'tap', x: A.x, y: A.y });
  } else {
    sendInput({ type: 'swipe', x1: A.x, y1: A.y, x2: B.x, y2: B.y, ms: Math.min(1500, Math.max(80, Math.round(ms))) });
  }
});
document.querySelectorAll('.mirror-nav button').forEach((btn) =>
  btn.addEventListener('click', () => sendInput({ type: 'key', name: btn.dataset.key })));

function fxTick() {
  if (!mirror.open) return;
  requestAnimationFrame(fxTick);
  const now = performance.now();
  while (ripples.length && now - ripples[0].t > 450) ripples.shift();
  const active = drag || ripples.length;
  if (!active && !fxHad) return;
  fxHad = !!active;
  const W = mEl.fx.width, H = mEl.fx.height, base = W * 0.05;
  fxCtx.clearRect(0, 0, W, H);
  fxCtx.lineWidth = Math.max(2, W * 0.006);
  if (drag) {  // finger down: dot at the current point + line from where it started
    fxCtx.strokeStyle = 'rgba(255,255,255,.85)'; fxCtx.fillStyle = 'rgba(56,189,248,.45)';
    fxCtx.beginPath(); fxCtx.moveTo(drag.a.fx * W, drag.a.fy * H); fxCtx.lineTo(drag.b.fx * W, drag.b.fy * H); fxCtx.stroke();
    fxCtx.beginPath(); fxCtx.arc(drag.b.fx * W, drag.b.fy * H, base * 0.9, 0, 7); fxCtx.fill(); fxCtx.stroke();
  }
  for (const r of ripples) {  // release: expanding ring
    const k = (now - r.t) / 450;
    fxCtx.strokeStyle = `rgba(255,255,255,${0.9 * (1 - k)})`; fxCtx.fillStyle = `rgba(56,189,248,${0.4 * (1 - k)})`;
    fxCtx.beginPath(); fxCtx.arc(r.fx * W, r.fy * H, base * (0.9 + k * 1.1), 0, 7); fxCtx.fill(); fxCtx.stroke();
  }
}

// ---- record: composite (screen + tap effects) -> MediaRecorder -> server saves it on the Desktop ----
const rec = { on: false, recorder: null, chunks: [], canvas: null, raf: 0, timer: 0, t0: 0 };

function recPickMime() {
  for (const [mime, ext] of [['video/mp4;codecs=avc1', 'mp4'], ['video/webm;codecs=vp9', 'webm'], ['video/webm;codecs=vp8', 'webm'], ['video/webm', 'webm']]) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(mime)) return { mime, ext };
  }
  return null;
}

async function recStart() {
  if (rec.on) return;
  if (mEl.screen.style.display !== 'block') { mirrorToast('Chưa có hình từ máy để quay.', true); return; }
  const pick = recPickMime();
  if (!pick) { mirrorToast('Trình duyệt không hỗ trợ MediaRecorder.', true); return; }
  try { await mirrorPost('/api/mirror/show-touches', { on: true }); }
  catch (e) { mirrorToast(`Không bật được Show taps trên máy (${e.message}) — vẫn quay, chỉ thiếu chấm chạm vật lý.`, true); }
  const w = mEl.canvas.width, h = mEl.canvas.height;
  rec.canvas = Object.assign(document.createElement('canvas'), { width: w, height: h });
  const ctx = rec.canvas.getContext('2d');
  const draw = () => { ctx.drawImage(mEl.canvas, 0, 0, w, h); ctx.drawImage(mEl.fx, 0, 0, w, h); };
  // setInterval, NOT requestAnimationFrame: rAF is throttled/fully suspended by the browser the
  // moment this tab isn't the focused/visible one, which silently freezes the recording canvas
  // while the live decode keeps going — then, on refocus, draw() jumps straight to whatever's
  // currently decoded. That's the exact "record bị đứng rồi tua đến khúc nào đó" bug. setInterval
  // keeps firing (Chrome clamps it to ~1/s at worst in a background tab, never fully stops it), so
  // recording through a background tab is choppy rather than silently skipping a chunk of playback.
  draw();
  rec.raf = setInterval(draw, 33);
  rec.recorder = new MediaRecorder(rec.canvas.captureStream(30), { mimeType: pick.mime, videoBitsPerSecond: 8_000_000 });
  rec.chunks = [];
  rec.recorder.ondataavailable = (e) => { if (e.data.size) rec.chunks.push(e.data); };
  rec.recorder.onstop = () => recUpload(pick.ext, rec.recorder.mimeType);
  rec.recorder.start(1000);
  rec.on = true; rec.t0 = Date.now();
  document.body.classList.add('recording');
  mEl.recBtn.title = 'Dừng quay và lưu ra Desktop';
  const tick = () => { const s = Math.floor((Date.now() - rec.t0) / 1000); mEl.recTimer.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  tick(); rec.timer = setInterval(tick, 500);
}

function recStop() {
  if (!rec.on) return;
  rec.on = false;
  clearInterval(rec.raf); clearInterval(rec.timer);
  document.body.classList.remove('recording');
  mEl.recBtn.title = 'Quay video (bật Show taps trên máy) → lưu ra Desktop';
  rec.recorder.stop();  // -> onstop -> recUpload
}

async function recUpload(ext, mime) {
  const blob = new Blob(rec.chunks, { type: mime });
  rec.chunks = [];
  mEl.recBtn.disabled = true;
  mirrorToast('Đang lưu bản quay ra Desktop...');
  try {
    const r = await fetch('/api/mirror/save-record?ext=' + ext, { method: 'POST', headers: { 'X-Requested-With': 'tracking-ui' }, body: blob });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    mirrorToast(`Đã lưu: ${j.path}`);
  } catch (e) {
    mirrorToast(`Lưu bản quay lỗi: ${e.message}`, true);
  } finally {
    mEl.recBtn.disabled = false;
    mirrorPost('/api/mirror/show-touches', { on: false }).catch(() => {});  // restore the phone's original setting
  }
}

mEl.recBtn.addEventListener('click', () => (rec.on ? recStop() : recStart()));
mEl.shotBtn.addEventListener('click', async () => {
  mEl.shotBtn.disabled = true;
  mirrorToast('Đang chụp...');
  try { mirrorToast(`Đã lưu: ${(await mirrorPost('/api/mirror/screenshot')).path}`); }
  catch (e) { mirrorToast(`Chụp lỗi: ${e.message}`, true); }
  finally { mEl.shotBtn.disabled = false; }
});

// ---- install: kéo/thả file .apk hoặc .aab vào màn hình máy để cài thẳng lên máy đang cắm ----
const INSTALL_EXTS = ['apk', 'aab'];
const extOf = (name) => (name.split('.').pop() || '').toLowerCase();

['dragenter', 'dragover'].forEach((evt) => mEl.stage.addEventListener(evt, (e) => {
  if (!mirror.open) return;
  e.preventDefault();  // bắt buộc phải preventDefault ở dragover thì drop mới bắn ra
  mEl.stage.classList.add('drag-over');
}));
['dragleave', 'dragend'].forEach((evt) => mEl.stage.addEventListener(evt, () => mEl.stage.classList.remove('drag-over')));

mEl.stage.addEventListener('drop', async (e) => {
  e.preventDefault();
  mEl.stage.classList.remove('drag-over');
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!file) return;
  const ext = extOf(file.name);
  if (!INSTALL_EXTS.includes(ext)) {
    mirrorToast(`Chỉ nhận file .apk hoặc .aab (không phải .${ext || '?'})`, true);
    return;
  }
  if (!mirror.serial) { mirrorToast('Chưa có máy nào đang kết nối.', true); return; }
  mirrorToast(`Đang cài ${file.name}${ext === 'aab' ? ' (build .aab có thể mất một lúc)' : ''}...`);
  try {
    const res = await fetch(`/api/mirror/install-app?filename=${encodeURIComponent(file.name)}`, {
      method: 'POST', headers: { 'X-Requested-With': 'tracking-ui' }, body: file,
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.ok) throw new Error(j.output || j.error || `HTTP ${res.status}`);
    mirrorToast(`Cài xong: ${file.name}`);
  } catch (err) {
    mirrorToast(`Cài lỗi:\n${err.message}`, true);
  }
});

// ---- panel open/close/resize + device switching ----
function mirrorSetOpen(open) {
  mirror.open = open;
  document.body.classList.toggle('mirror-open', open);
  try { localStorage.setItem('mirrorOpen', open ? '1' : '0'); } catch (e) {}
  if (!open) { recStop(); mirrorStop(); return; }
  requestAnimationFrame(fxTick);
  if (mirror.serial) mirrorStart(); else mirrorMsg('Chưa có máy nào đang kết nối.', true);
}

function mirrorOnDevice(info) {
  const serial = info.state === 'connected' ? info.serial : null;
  if (serial === mirror.serial) return;
  mirror.serial = serial;
  if (!mirror.open) return;
  recStop();
  if (serial) mirrorStart(); else { mirrorStop(); mirrorMsg('Chưa có máy nào đang kết nối.', true); }
}

mEl.toggle.addEventListener('click', () => mirrorSetOpen(!mirror.open));
document.getElementById('mirror-close').addEventListener('click', () => mirrorSetOpen(false));
document.getElementById('mirror-restart').addEventListener('click', () => { if (mirror.serial) mirrorStart(); });

function mirrorSetWidth(px) {
  document.documentElement.style.setProperty('--mirror-w', px + 'px');
  try { localStorage.setItem('mirrorW', String(px)); } catch (e) {}
}
try { const w = parseInt(localStorage.getItem('mirrorW'), 10); if (w >= 280) mirrorSetWidth(w); } catch (e) {}
const resizer = document.getElementById('mirror-resize');
resizer.addEventListener('pointerdown', (e) => { resizer.setPointerCapture(e.pointerId); resizer.classList.add('drag'); });
resizer.addEventListener('pointermove', (e) => {
  if (!resizer.classList.contains('drag')) return;
  mirrorSetWidth(Math.round(Math.max(280, Math.min(window.innerWidth * 0.7, window.innerWidth - e.clientX))));
});
resizer.addEventListener('pointerup', () => resizer.classList.remove('drag'));

function connect() {
  const es = new EventSource('/events');
  es.addEventListener('open', () => { statusEl.textContent = 'Đã kết nối'; statusEl.className = 'connected'; });
  es.addEventListener('error', () => { statusEl.textContent = 'Mất kết nối, đang thử lại...'; statusEl.className = 'error'; });
  es.addEventListener('status', (e) => { document.getElementById('status-message').textContent = JSON.parse(e.data).message; });
  es.addEventListener('device', (e) => { renderDevice(JSON.parse(e.data)); });
  es.addEventListener('spec', (e) => renderSpec(JSON.parse(e.data)));
  es.addEventListener('track', (e) => routeEvent(JSON.parse(e.data)));
  es.addEventListener('coverage', () => scheduleCoverage());
  es.addEventListener('error_log', (e) => routeError(JSON.parse(e.data)));
}

// ---- self-update: only shown when this checkout is a git clone (colleagues running from a
// zip / non-git copy just don't see the box — nothing to update against) ----
const updEl = { box: document.getElementById('update-box'), ver: document.getElementById('update-ver'), btn: document.getElementById('update-btn') };
let updBusy = false, updCommit = null;

function updLabel(text, busy) {
  updEl.btn.textContent = text;
  updBusy = !!busy;
  updEl.btn.classList.toggle('busy', updBusy);
}

async function updLoadVersion() {
  let v;
  try { v = await (await fetch('/api/version')).json(); } catch (e) { return null; }
  if (!v.is_repo) { updEl.box.style.display = 'none'; return null; }
  updEl.box.style.display = 'inline-flex';
  updCommit = v.commit;
  updEl.ver.textContent = 'v' + (v.commit || '?') + (v.dirty ? '*' : '');
  updEl.ver.title = [v.branch && `nhánh ${v.branch}`, v.date, v.dirty ? '(có sửa tay chưa commit)' : '']
    .filter(Boolean).join(' · ');
  return v;
}

async function updAfterRestart(prevCommit) {
  updLabel('Đang khởi động lại...', true);
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 1000));
    const v = await updLoadVersion();
    if (v && v.commit !== prevCommit) { location.reload(); return; }
  }
  updLabel('Update', false);  // took too long — let the user check the terminal / try again
}

async function updAfterFullRelaunch() {
  // The whole app (not just the server) is quitting and reopening itself — THIS window/tab is
  // about to die along with it, so there's nothing useful to poll for from in here. Only show
  // a label; if the tab is somehow still alive a while later, the relaunch didn't happen (e.g.
  // `open` failed) and the button should go back to usable rather than stay stuck forever.
  updLabel('Đang khởi động lại app...', true);
  await new Promise(r => setTimeout(r, 8000));
  updLabel('Update', false);
}

updEl.btn.addEventListener('click', async () => {
  if (updBusy) return;
  updLabel('Đang kiểm tra...', true);
  let chk;
  try { chk = await (await fetch('/api/check-update')).json(); }
  catch (e) { chk = { checked: false, error: e.message }; }
  if (!chk.checked) {
    alert(`Không kiểm tra được bản mới: ${chk.error || 'lỗi không rõ'}`);
    updLabel('Update', false);
    return;
  }
  if (!chk.update_available) {
    updLabel('Đã mới nhất', false);
    setTimeout(() => { if (!updBusy) updLabel('Update', false); }, 2000);
    return;
  }
  if (!confirm(`Có bản mới (sau ${chk.behind} commit).\n\nCập nhật và khởi động lại server ngay bây giờ?`)) {
    updLabel('Update', false);
    return;
  }
  updLabel('Đang cập nhật...', true);
  const prevCommit = updCommit;
  let res;
  try { res = await (await fetch('/api/self-update', { method: 'POST' })).json(); }
  catch (e) { res = { ok: false, error: e.message }; }
  if (!res.ok) {
    alert(`Update lỗi:\n\n${res.error || 'lỗi không rõ'}`);
    updLabel('Update', false);
    return;
  }
  if (!res.restarted) {
    updLabel('Đã mới nhất', false);
    setTimeout(() => { if (!updBusy) updLabel('Update', false); }, 2000);
    return;
  }
  if (res.full_relaunch) { updAfterFullRelaunch(); return; }
  updAfterRestart(prevCommit);
});

updLoadVersion().catch(() => {});

try { if (localStorage.getItem('mirrorOpen') === '1') mirrorSetOpen(true); } catch (e) {}
loadHistory().then(connect).catch(connect);
</script>
